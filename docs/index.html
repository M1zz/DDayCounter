<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음력세기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #6d8bff 0%, #4c6ef5 45%, #2a2168 100%);
    min-height: 100vh; color: #fff; display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased; text-align: center; padding: 24px;
  }
  .box { max-width: 460px; }
  .moon { font-size: 84px; line-height: 1; }
  h1 { font-size: 34px; margin: 18px 0 6px; }
  p { color: rgba(255,255,255,0.9); font-size: 17px; line-height: 1.6; margin: 0 0 28px; }
  .links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 14px 26px; border-radius: 14px; font-weight: 600;
    text-decoration: none; font-size: 16px; }
  .primary { background: #fff; color: #3b41a0; }
  .ghost { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.35); }
  a.btn:hover { opacity: 0.92; }
</style>
</head>
<body>
  <div class="box">
    <div class="moon">🌙</div>
    <h1>음력세기</h1>
    <p>중요한 날짜를 양력·음력으로 관리하고<br>위젯으로 남은 일수를 확인하는 iOS 앱</p>
    <div class="links">
      <a class="btn primary" href="support.html">지원 (Support)</a>
      <a class="btn ghost" href="privacy.html">개인정보 처리방침</a>
    </div>
  </div>
</body>
</html>
